# Drop-in for pocketbase.service: install as
#   /etc/systemd/system/pocketbase.service.d/override.conf
# A drop-in rather than a replacement unit, so anything else the existing unit
# sets is kept. Rollback: delete this file, `systemctl daemon-reload`, restart.
[Service]
# Not root: a compromise of PocketBase is then a compromise of its own data,
# not of the machine. The binary stays root-owned so it cannot replace itself.
User=pocketbase
Group=pocketbase

# --automigrate=false: schema changes come only from the repo (pb_migrations/,
# applied by deploy/pb-migrate.sh during deploy). With it on, every schema edit
# made through the API or admin UI wrote a migration file on the server that
# the repo never saw; about 40 of those are in /opt/pocketbase/pb_migrations.
ExecStart=
ExecStart=/opt/pocketbase/pocketbase serve --http="127.0.0.1:8090" --automigrate=false

NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/opt/pocketbase/pb_data /opt/pocketbase/pb_migrations
